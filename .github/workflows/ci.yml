name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - name: No ROMs or extracted game data in the repo
        run: python tools/check_no_rom.py
      - name: Export the Rick & Morty sprites (needed by the pose tests)
        working-directory: ports/rick-and-morty
        run: node dump_sprites.mjs out/sprites.json
      - name: Unit tests (no ROM needed)
        run: python -m unittest discover tests -v
